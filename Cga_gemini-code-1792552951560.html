<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to 320x200 CGA Ditherer</title>
    <style>
        body {
            font-family: monospace;
            background-color: #111;
            color: #eee;
            text-align: center;
            padding: 20px;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid #333;
            max-width: 100%;
            width: 640px;
            height: 400px;
            margin-top: 15px;
            background: #000;
        }
        .controls {
            margin: 15px 0;
        }
        button {
            background: #333;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px 20px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover {
            background: #0f0;
            color: #000;
        }
    </style>
</head>
<body>

    <h2>CGA 320x200 DITHERED IMAGE GENERATOR</h2>
    
    <div class="controls">
        <input type="file" id="upload" accept="image/*">
    </div>

    <div>
        <canvas id="canvas" width="320" height="200"></canvas>
    </div>

    <div class="controls">
        <button id="downloadBtn" disabled>Download HTML Code File (.txt)</button>
    </div>

<script>
const upload = document.getElementById('upload');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const downloadBtn = document.getElementById('downloadBtn');

// Classic CGA Palette Mode 1 (Cyan, Magenta, White, Black)
const cgaPalette = [
    [0, 0, 0],       // 0: Black
    [0, 255, 255],   // 1: Cyan
    [255, 0, 255],   // 2: Magenta
    [255, 255, 255]  // 3: White
];

// 4x4 Bayer Matrix for Ordered Dithering
const bayerMatrix = [
    [ 0,  8,  2, 10],
    [12,  4, 14,  6],
    [ 3, 11,  1,  9],
    [15,  7, 13,  5]
];

upload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
            // Draw image scaled down exactly to 320x200
            ctx.clearRect(0, 0, 320, 200);
            ctx.drawImage(img, 0, 0, 320, 200);
            
            applyCGADithering();
            downloadBtn.disabled = false;
        }
        img.src = event.target.result;
    }
    reader.readAsDataURL(file);
});

function applyCGADithering() {
    const imgData = ctx.getImageData(0, 0, 320, 200);
    const data = imgData.data;

    for (let y = 0; y < 200; y++) {
        for (let x = 0; x < 320; x++) {
            let i = (y * 320 + x) * 4;
            
            // Convert to grayscale intensity
            let gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
            
            // Apply Bayer matrix threshold factor (-0.5 to 0.5 modifier)
            let mapValue = (bayerMatrix[y % 4][x % 4] / 16.0) - 0.5;
            let adjustedGray = Math.min(255, Math.max(0, gray + mapValue * 64));

            // Map intensity to 2-bit CGA 4-color space
            let colorIndex = 0;
            if (adjustedGray > 192) colorIndex = 3;       // White
            else if (adjustedGray > 128) colorIndex = 1;  // Cyan (or choose Magenta)
            else if (adjustedGray > 64) colorIndex = 2;   // Magenta
            else colorIndex = 0;                          // Black

            // Write back palette values
            data[i]     = cgaPalette[colorIndex][0];
            data[i + 1] = cgaPalette[colorIndex][1];
            data[i + 2] = cgaPalette[colorIndex][2];
        }
    }
    ctx.putImageData(imgData, 0, 0);
}

// Package current canvas layout into a downloadable HTML text file
downloadBtn.addEventListener('click', () => {
    const dataUrl = canvas.toDataURL();
    const htmlTemplate = `<!DOCTYPE html>
<html>
<head><title>CGA Render</title></head>
<body style="background:#000;text-align:center;">
    <img src="${dataUrl}" style="width:640px;image-rendering:pixelated;" alt="CGA 320x200">
</body>
</html>`;

    const blob = new Blob([htmlTemplate], { type: 'text/plain' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'cga_image_output.txt';
    link.click();
});
</script>

</body>
</html>
