<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-Bit Dithering: Image to 320x200 Digits (.txt)</title>
  <style>
    :root {
      --bg: #0f141c;
      --card-bg: #1a2230;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #2e3b4e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.02);
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.08);
    }
    .dropzone p { color: var(--text-muted); margin-top: 8px; font-size: 0.85rem; }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text); }
    select, input[type="checkbox"] {
      background: #0f141c;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }

    .checkbox-group {
      flex-direction: row;
      align-items: center;
      margin-top: 22px;
      gap: 8px;
    }

    .preview-section {
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-size: 0.75rem;
      background: #223249;
      color: #60a5fa;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .canvas-wrapper {
      background: #000;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      justify-content: center;
      border: 1px solid var(--border);
    }
    canvas {
      width: 100%;
      max-width: 640px; /* 2x scale for preview */
      height: auto;
      aspect-ratio: 320 / 200;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #334155;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: #0b0f15;
      color: #10b981;
      font-family: monospace;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      resize: vertical;
      white-space: pre;
      overflow-x: auto;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>2-Bit Dithered Image to Digits (320 × 200)</h1>
    <p>Converts any image into a 320x200 grid of digits (0, 1, 2, 3) and exports to a .txt file.</p>
  </header>

  <div class="card">
    <div class="dropzone" id="dropzone">
      <strong>Click to browse</strong> or drag & drop an image here
      <p>Supports PNG, JPG, WEBP, GIF, BMP</p>
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="algorithm">Dithering Algorithm</label>
        <select id="algorithm">
          <option value="floyd">Floyd-Steinberg (Error Diffusion)</option>
          <option value="bayer">Bayer 4×4 (Ordered Matrix)</option>
          <option value="none">Threshold (No Dither)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="fitMode">Aspect Ratio Handling</label>
        <select id="fitMode">
          <option value="stretch">Stretch to 320x200</option>
          <option value="cover">Crop to Fill (Preserve Ratio)</option>
          <option value="contain">Fit with Black Padding</option>
        </select>
      </div>

      <div class="control-group checkbox-group">
        <input type="checkbox" id="invertDigits">
        <label for="invertDigits" style="margin: 0; cursor: pointer;">Invert (0 = White, 3 = Black)</label>
      </div>
    </div>
  </div>

  <div class="card preview-section" id="previewSection">
    <div class="preview-header">
      <h2>Preview (320 × 200)</h2>
      <span class="badge" id="statsBadge">64,000 Digits (200 lines × 320)</span>
    </div>

    <div class="canvas-wrapper">
      <canvas id="canvas" width="320" height="200"></canvas>
    </div>

    <label>Sample Output (First 10 lines)</label>
    <textarea id="textSnippet" readonly></textarea>

    <button class="btn" id="downloadBtn">
      📥 Download .TXT File (320x200)
    </button>
  </div>
</div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const previewSection = document.getElementById('previewSection');
  const textSnippet = document.getElementById('textSnippet');
  const downloadBtn = document.getElementById('downloadBtn');
  const algorithmSelect = document.getElementById('algorithm');
  const fitModeSelect = document.getElementById('fitMode');
  const invertDigits = document.getElementById('invertDigits');

  const WIDTH = 320;
  const HEIGHT = 200;
  let currentImage = null;
  let generatedDigits = '';

  // Bayer 4x4 matrix normalized to [-0.5, 0.5]
  const bayer4x4 = [
    [ 0,  8,  2, 10],
    [12,  4, 14,  6],
    [ 3, 11,  1,  9],
    [15,  7, 13,  5]
  ].map(row => row.map(v => (v / 16) - 0.5));

  // Event Listeners
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) loadImage(e.target.files[0]);
  });

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      loadImage(e.dataTransfer.files[0]);
    }
  });

  algorithmSelect.addEventListener('change', processImage);
  fitModeSelect.addEventListener('change', processImage);
  invertDigits.addEventListener('change', processImage);

  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        previewSection.style.display = 'flex';
        processImage();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function processImage() {
    if (!currentImage) return;

    // 1. Draw and resize onto canvas
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    const fit = fitModeSelect.value;
    if (fit === 'stretch') {
      ctx.drawImage(currentImage, 0, 0, WIDTH, HEIGHT);
    } else if (fit === 'contain') {
      const scale = Math.min(WIDTH / currentImage.width, HEIGHT / currentImage.height);
      const w = currentImage.width * scale;
      const h = currentImage.height * scale;
      const x = (WIDTH - w) / 2;
      const y = (HEIGHT - h) / 2;
      ctx.drawImage(currentImage, x, y, w, h);
    } else if (fit === 'cover') {
      const scale = Math.max(WIDTH / currentImage.width, HEIGHT / currentImage.height);
      const w = currentImage.width * scale;
      const h = currentImage.height * scale;
      const x = (WIDTH - w) / 2;
      const y = (HEIGHT - h) / 2;
      ctx.drawImage(currentImage, x, y, w, h);
    }

    // 2. Extract Grayscale Intensity Array [0..255]
    const imgData = ctx.getImageData(0, 0, WIDTH, HEIGHT);
    const data = imgData.data;
    const gray = new Float32Array(WIDTH * HEIGHT);

    for (let i = 0; i < data.length; i += 4) {
      // Standard Rec. 601 luma
      gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    }

    // 3. Apply 2-bit quantization (4 levels: 0, 85, 170, 255)
    const ditherMode = algorithmSelect.value;
    const digitGrid = new Uint8Array(WIDTH * HEIGHT);

    if (ditherMode === 'floyd') {
      // Floyd-Steinberg error diffusion with serpentine scanning
      for (let y = 0; y < HEIGHT; y++) {
        const leftToRight = (y % 2 === 0);
        const startX = leftToRight ? 0 : WIDTH - 1;
        const endX = leftToRight ? WIDTH : -1;
        const stepX = leftToRight ? 1 : -1;

        for (let x = startX; x !== endX; x += stepX) {
          const idx = y * WIDTH + x;
          const oldVal = Math.min(255, Math.max(0, gray[idx]));
          
          // Quantize to 0, 1, 2, 3
          const qLevel = Math.round(oldVal / 85); // 0..3
          const newVal = qLevel * 85;
          digitGrid[idx] = qLevel;

          const error = oldVal - newVal;

          // Distribute error to neighbors
          if (leftToRight) {
            if (x + 1 < WIDTH) gray[idx + 1] += error * (7 / 16);
            if (y + 1 < HEIGHT) {
              if (x - 1 >= 0) gray[idx + WIDTH - 1] += error * (3 / 16);
              gray[idx + WIDTH] += error * (5 / 16);
              if (x + 1 < WIDTH) gray[idx + WIDTH + 1] += error * (1 / 16);
            }
          } else {
            if (x - 1 >= 0) gray[idx - 1] += error * (7 / 16);
            if (y + 1 < HEIGHT) {
              if (x + 1 < WIDTH) gray[idx + WIDTH + 1] += error * (3 / 16);
              gray[idx + WIDTH] += error * (5 / 16);
              if (x - 1 >= 0) gray[idx + WIDTH - 1] += error * (1 / 16);
            }
          }
        }
      }
    } else if (ditherMode === 'bayer') {
      for (let y = 0; y < HEIGHT; y++) {
        for (let x = 0; x < WIDTH; x++) {
          const idx = y * WIDTH + x;
          const thresholdOffset = bayer4x4[y % 4][x % 4] * 85;
          const adjusted = Math.min(255, Math.max(0, gray[idx] + thresholdOffset));
          digitGrid[idx] = Math.min(3, Math.max(0, Math.round(adjusted / 85)));
        }
      }
    } else {
      // Threshold (no dithering)
      for (let i = 0; i < gray.length; i++) {
        digitGrid[i] = Math.min(3, Math.max(0, Math.round(gray[i] / 85)));
      }
    }

    // 4. Invert if requested & draw result back to preview canvas
    const invert = invertDigits.checked;
    const lines = [];

    for (let y = 0; y < HEIGHT; y++) {
      let line = '';
      for (let x = 0; x < WIDTH; x++) {
        const idx = y * WIDTH + x;
        let d = digitGrid[idx];
        if (invert) d = 3 - d;

        line += d;

        // Render back to canvas preview (0: black, 1: dark gray, 2: light gray, 3: white)
        const displayVal = (invert ? (3 - d) : d) * 85;
        const pIdx = idx * 4;
        data[pIdx] = displayVal;
        data[pIdx + 1] = displayVal;
        data[pIdx + 2] = displayVal;
        data[pIdx + 3] = 255;
      }
      lines.push(line);
    }

    ctx.putImageData(imgData, 0, 0);

    generatedDigits = lines.join('\n');
    textSnippet.value = lines.slice(0, 10).join('\n') + '\n... [190 more lines]';
  }

  // 5. Download TXT file
  downloadBtn.addEventListener('click', () => {
    if (!generatedDigits) return;
    const blob = new Blob([generatedDigits], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'image_2bit_320x200.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
