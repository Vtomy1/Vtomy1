<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image to 4-Bit EGA Hex Converter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121214;
      color: #e0e0e0;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { color: #55ffff; font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #aaa; margin-top: 0; font-size: 0.9rem; }
    .card {
      background: #1e1e24;
      border: 1px solid #2e2e38;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    label { font-size: 0.85rem; font-weight: 600; color: #ccc; }
    input, select, button {
      background: #2a2a34;
      border: 1px solid #3e3e4a;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    input[type="number"] { width: 90px; }
    button {
      background: #00aaaa;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #55ffff; color: #000; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .canvas-container {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      overflow-x: auto;
    }
    .canvas-box {
      text-align: center;
      background: #141418;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #2c2c36;
    }
    .canvas-box span { display: block; font-size: 0.75rem; color: #888; margin-bottom: 4px; }
    canvas {
      max-width: 400px;
      height: auto;
      image-rendering: pixelated;
      background: #000;
    }
    textarea {
      width: 100%;
      height: 200px;
      background: #141418;
      border: 1px solid #2e2e38;
      color: #55ff55;
      font-family: monospace;
      font-size: 0.75rem;
      border-radius: 4px;
      padding: 10px;
      box-sizing: border-box;
      white-space: pre;
    }
  </style>
</head>
<body>

  <h1>Image to 4-Bit EGA Hex (0–F)</h1>
  <p>Convert any image into a 16-color EGA palette hex string with Floyd-Steinberg dithering and download as a formatted .txt file.</p>

  <div class="card">
    <div class="row">
      <div>
        <label>Upload Image:</label><br />
        <input type="file" id="fileInput" accept="image/*" />
      </div>
      <div>
        <label>Width:</label><br />
        <input type="number" id="targetWidth" value="64" min="1" max="1024" />
      </div>
      <div>
        <label>Height:</label><br />
        <input type="number" id="targetHeight" value="64" min="1" max="1024" />
      </div>
      <div>
        <label>Aspect Ratio:</label><br />
        <label style="font-weight: normal; cursor: pointer;">
          <input type="checkbox" id="lockAspect" checked /> Preserve
        </label>
      </div>
      <div>
        <label>Dithering:</label><br />
        <select id="ditherMode">
          <option value="floyd">Floyd-Steinberg</option>
          <option value="none">None (Nearest Color)</option>
        </select>
      </div>
      <div>
        <label>Hex Case:</label><br />
        <select id="hexCase">
          <option value="lower">0-f (lowercase)</option>
          <option value="upper">0-F (uppercase)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <button id="convertBtn" disabled>Process Image</button>
      <button id="downloadBtn" style="background: #aa00aa;" disabled>Download .txt File</button>
    </div>

    <div class="canvas-container">
      <div class="canvas-box">
        <span>Resized Source</span>
        <canvas id="sourceCanvas"></canvas>
      </div>
      <div class="canvas-box">
        <span>4-Bit EGA Preview</span>
        <canvas id="egaCanvas"></canvas>
      </div>
    </div>
  </div>

  <div class="card">
    <label>Generated Hex Output Preview:</label>
    <textarea id="hexOutput" readonly placeholder="Hex output will appear here..."></textarea>
  </div>

  <script>
    // Standard 16-color EGA palette
    const EGA_PALETTE = [
      [0, 0, 0],       // 0
      [0, 0, 170],     // 1
      [0, 170, 0],     // 2
      [0, 170, 170],   // 3
      [170, 0, 0],     // 4
      [170, 0, 170],   // 5
      [170, 85, 0],    // 6
      [170, 170, 170], // 7
      [85, 85, 85],    // 8
      [85, 85, 255],   // 9
      [85, 255, 85],   // a
      [85, 255, 255],  // b
      [255, 85, 85],   // c
      [255, 85, 255],  // d
      [255, 255, 85],  // e
      [255, 255, 255]  // f
    ];

    let loadedImg = null;
    let generatedTxt = "";

    const fileInput = document.getElementById("fileInput");
    const widthInput = document.getElementById("targetWidth");
    const heightInput = document.getElementById("targetHeight");
    const lockAspect = document.getElementById("lockAspect");
    const ditherMode = document.getElementById("ditherMode");
    const hexCase = document.getElementById("hexCase");
    const convertBtn = document.getElementById("convertBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const sourceCanvas = document.getElementById("sourceCanvas");
    const egaCanvas = document.getElementById("egaCanvas");
    const hexOutput = document.getElementById("hexOutput");

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImg = new Image();
        loadedImg.onload = () => {
          if (lockAspect.checked) {
            const aspect = loadedImg.height / loadedImg.width;
            heightInput.value = Math.round(parseInt(widthInput.value, 10) * aspect);
          }
          convertBtn.disabled = false;
          processImage();
        };
        loadedImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    widthInput.addEventListener("input", () => {
      if (loadedImg && lockAspect.checked) {
        const aspect = loadedImg.height / loadedImg.width;
        heightInput.value = Math.max(1, Math.round(parseInt(widthInput.value, 10) * aspect));
      }
    });

    convertBtn.addEventListener("click", processImage);

    function findClosestColor(r, g, b) {
      let minDist = Infinity;
      let closestIdx = 0;
      for (let i = 0; i < 16; i++) {
        const [pr, pg, pb] = EGA_PALETTE[i];
        const dist = (r - pr) ** 2 + (g - pg) ** 2 + (b - pb) ** 2;
        if (dist < minDist) {
          minDist = dist;
          closestIdx = i;
        }
      }
      return closestIdx;
    }

    function processImage() {
      if (!loadedImg) return;

      const w = parseInt(widthInput.value, 10);
      const h = parseInt(heightInput.value, 10);

      sourceCanvas.width = w;
      sourceCanvas.height = h;
      egaCanvas.width = w;
      egaCanvas.height = h;

      const srcCtx = sourceCanvas.getContext("2d");
      srcCtx.drawImage(loadedImg, 0, 0, w, h);

      const srcData = srcCtx.getImageData(0, 0, w, h);
      const pixels = srcData.data;

      // Float buffer for RGB error diffusion
      const buffer = new Float32Array(w * h * 3);
      for (let i = 0, j = 0; i < pixels.length; i += 4, j += 3) {
        buffer[j]     = pixels[i];
        buffer[j + 1] = pixels[i + 1];
        buffer[j + 2] = pixels[i + 2];
      }

      const egaCtx = egaCanvas.getContext("2d");
      const egaData = egaCtx.createImageData(w, h);
      const outPixels = egaData.data;

      const isDither = ditherMode.value === "floyd";
      const isUpper = hexCase.value === "upper";
      const hexLines = [];

      for (let y = 0; y < h; y++) {
        let rowStr = "";
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 3;
          let r = Math.min(255, Math.max(0, buffer[idx]));
          let g = Math.min(255, Math.max(0, buffer[idx + 1]));
          let b = Math.min(255, Math.max(0, buffer[idx + 2]));

          const palIdx = findClosestColor(r, g, b);
          const [nr, ng, nb] = EGA_PALETTE[palIdx];

          // Output canvas pixel
          const outIdx = (y * w + x) * 4;
          outPixels[outIdx]     = nr;
          outPixels[outIdx + 1] = ng;
          outPixels[outIdx + 2] = nb;
          outPixels[outIdx + 3] = 255;

          // Hex string digit (0-f)
          let hexChar = palIdx.toString(16);
          if (isUpper) hexChar = hexChar.toUpperCase();
          rowStr += hexChar;

          // Error diffusion
          if (isDither) {
            const errR = r - nr;
            const errG = g - ng;
            const errB = b - nb;

            function addErr(px, py, factor) {
              if (px >= 0 && px < w && py >= 0 && py < h) {
                const target = (py * w + px) * 3;
                buffer[target]     += errR * factor;
                buffer[target + 1] += errG * factor;
                buffer[target + 2] += errB * factor;
              }
            }

            addErr(x + 1, y,     7 / 16);
            addErr(x - 1, y + 1, 3 / 16);
            addErr(x,     y + 1, 5 / 16);
            addErr(x + 1, y + 1, 1 / 16);
          }
        }
        hexLines.push(rowStr);
      }

      egaCtx.putImageData(egaData, 0, 0);

      // Format txt file output
      generatedTxt = `WIDTH: ${w}\nHEIGHT: ${h}\n` + hexLines.join("\n");
      hexOutput.value = generatedTxt;
      downloadBtn.disabled = false;
    }

    downloadBtn.addEventListener("click", () => {
      if (!generatedTxt) return;
      const blob = new Blob([generatedTxt], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ega_4bit_${widthInput.value}x${heightInput.value}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
